name: Validate patches

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.31.3
      - run: find catalog -name '*.sdpatch.json' -print0 | xargs -0 check-jsonschema --schemafile schema/sdpatch-v1.schema.json
      - run: python scripts/validate_catalog.py
